name: Deploy Voidfallen Web to GitHub Pages

on: 
  push:
    branches:
      - main # Set this to the branch you want to deploy from

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or your preferred Node.js version

      - name: Install dependencies and Build 🏗️
        run: |
          cd voidfallen-web
          npm install
          npm run build

      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./voidfallen-web/dist
          # The branch the action should deploy to. gh-pages is default
          publish_branch: gh-pages
          # Keep the .nojekyll file to prevent GitHub Pages from trying to build with Jekyll
          keep_files: true